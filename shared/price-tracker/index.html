<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sim Companies 交易所行情</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--line:#21262d;--fg:#e6edf3;--dim:#8b949e;--up:#3fb950;--down:#f85149;--accent:#58a6ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
  h1{font-size:16px;margin:0;font-weight:600}
  .meta{color:var(--dim);font-size:12px}
  .windows{display:flex;flex-wrap:wrap;gap:6px}
  .windows button{background:var(--panel);color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:12px}
  .windows button.on{background:var(--accent);color:#0d1117;border-color:var(--accent);font-weight:600}
  main{display:grid;grid-template-columns:1fr 420px;gap:16px;padding:16px;align-items:start}
  @media(max-width:900px){main{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
  #chartTitle{font-weight:600;margin-bottom:2px}
  #chartSub{color:var(--dim);font-size:12px;margin-bottom:2px}
  #chartVol{color:var(--dim);font-size:12px;margin-bottom:10px;min-height:14px}
  canvas{width:100%;height:340px;display:block}
  .tablewrap{max-height:78vh;overflow:auto}
  input#search{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:8px 10px;margin-bottom:10px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{position:sticky;top:0;background:var(--panel);text-align:right;color:var(--dim);font-weight:500;padding:6px 8px;cursor:pointer;border-bottom:1px solid var(--line);user-select:none}
  th:first-child,td:first-child{text-align:left}
  td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  tr{cursor:pointer}
  tr:hover td{background:#1c2230}
  tr.sel td{background:#1f2937}
  .up{color:var(--up)}.down{color:var(--down)}
  .name{color:var(--fg)}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--up);margin-right:6px;vertical-align:middle}
  .dot.d{background:var(--down)}
</style>
</head>
<body>
<header>
  <h1>📈 Sim Companies 交易所行情</h1>
  <div class="windows" id="windows"></div>
  <div class="meta" id="status">加载中…</div>
</header>
<main>
  <div class="card">
    <div id="chartTitle">选择一个商品</div>
    <div id="chartSub">点右侧表格里任意商品查看走势</div>
    <div id="chartVol"></div>
    <canvas id="chart" width="800" height="340"></canvas>
  </div>
  <div class="card">
    <input id="search" placeholder="搜索商品（如 coffee / steak / crude）…">
    <div class="tablewrap">
      <table id="tbl">
        <thead><tr>
          <th data-k="name">商品</th>
          <th data-k="price">现价</th>
          <th data-k="chg">涨跌%</th>
          <th data-k="vol">成交量</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</main>
<script>
const WINDOWS = [
  ['1分',60],['5分',300],['10分',600],['30分',1800],['1时',3600],
  ['3时',10800],['6时',21600],['12时',43200],['1天',86400],['3天',259200],['1周',604800]
];
let win = 3600, sel = null, sort = {k:'chg',dir:-1}, data = null, filter = '';

const $ = s => document.querySelector(s);
function fmt(n){ if(n==null) return '—'; const a=Math.abs(n); return a>=100?n.toFixed(0):a>=1?n.toFixed(2):n.toFixed(3); }
function fmtVol(n){ if(!n) return '—'; if(n>=1e6) return (n/1e6).toFixed(2)+'M'; if(n>=1e3) return (n/1e3).toFixed(1)+'k'; return String(Math.round(n)); }
function fmtT(sec){ const d=new Date(sec*1000); return d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}); }

// build window buttons
const wc = $('#windows');
WINDOWS.forEach(([label,sec])=>{
  const b=document.createElement('button'); b.textContent=label; b.dataset.sec=sec;
  if(sec===win) b.className='on';
  b.onclick=()=>{ win=sec; [...wc.children].forEach(x=>x.className=x.dataset.sec==sec?'on':''); load(); };
  wc.appendChild(b);
});
$('#search').oninput = e=>{ filter=e.target.value.toLowerCase().trim(); renderTable(); };
document.querySelectorAll('th').forEach(th=>th.onclick=()=>{ const k=th.dataset.k; sort.dir = sort.k===k? -sort.dir : (k==='name'?1:-1); sort.k=k; renderTable(); });

// per-kind series [ [t,price], ... ] from raw samples
function seriesFor(kind){
  if(!data) return [];
  return data.samples.map(s=>[s.t, s.p[kind]]).filter(x=>x[1]!=null);
}
function rows(){
  if(!data||!data.samples.length) return [];
  const last = data.samples[data.samples.length-1].p;
  const first = data.samples[0].p;
  const vu = (data.vol&&data.vol.u)||{}, vv = (data.vol&&data.vol.v)||{};
  return Object.keys(data.names).map(k=>{
    const price=last[k], p0=first[k];
    const chg = (price!=null&&p0!=null&&p0!==0)? (price-p0)/p0*100 : null;
    return {kind:k, name:data.names[k], price, chg, vol:vu[k]||0, vold:vv[k]||0};
  }).filter(r=>r.price!=null);
}
function renderTable(){
  let rs = rows();
  if(filter) rs=rs.filter(r=>r.name.toLowerCase().includes(filter));
  rs.sort((a,b)=>{ let av=a[sort.k],bv=b[sort.k]; if(sort.k==='name'){av=av||'';bv=bv||'';return av<bv?-sort.dir:av>bv?sort.dir:0;} av=av==null?-1e18:av; bv=bv==null?-1e18:bv; return (av-bv)*sort.dir; });
  const tb=$('#tbody'); tb.innerHTML='';
  rs.forEach(r=>{
    const tr=document.createElement('tr'); if(r.kind===sel) tr.className='sel';
    const cls=r.chg>0?'up':r.chg<0?'down':'';
    const sign=r.chg>0?'+':'';
    tr.innerHTML=`<td class="name"><span class="dot ${r.chg<0?'d':''}"></span>${r.name}</td>
      <td>$${fmt(r.price)}</td><td class="${cls}">${r.chg==null?'—':sign+r.chg.toFixed(2)+'%'}</td>
      <td title="${r.vol?r.vol.toLocaleString()+' 件 / $'+r.vold.toLocaleString():''}">${fmtVol(r.vol)}</td>`;
    tr.onclick=()=>{ sel=r.kind; renderTable(); drawChart(); };
    tb.appendChild(tr);
  });
}
function drawChart(){
  const c=$('#chart'), ctx=c.getContext('2d');
  const cssW=c.clientWidth||800, cssH=340, dpr=window.devicePixelRatio||1;
  c.width=cssW*dpr; c.height=cssH*dpr; ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,cssW,cssH);
  if(sel==null){ $('#chartTitle').textContent='选择一个商品'; $('#chartSub').textContent='点右侧表格里任意商品查看走势'; $('#chartVol').textContent=''; return; }
  const s=seriesFor(sel);
  $('#chartTitle').textContent=data.names[sel];
  // window volume readout for the selected kind
  {
    const vu=((data.vol&&data.vol.u)||{})[sel]||0, vv=((data.vol&&data.vol.v)||{})[sel]||0, va=((data.vol&&data.vol.amb)||{})[sel]||0;
    let txt = vu? `窗口成交量 ${vu.toLocaleString()} 件 · 成交额 $${vv.toLocaleString()}` : '窗口内无成交记录';
    if(va) txt += ` · 另有 ${va.toLocaleString()} 件深度截断存疑`;
    $('#chartVol').textContent = txt;
  }
  if(s.length<2){ $('#chartSub').textContent='该窗口内数据点不足（采集刚开始或商品无成交）'; return; }
  const ts=s.map(x=>x[0]), ps=s.map(x=>x[1]);
  const t0=ts[0],t1=ts[ts.length-1], pmin=Math.min(...ps), pmax=Math.max(...ps);
  const pad=(pmax-pmin)*0.12||Math.abs(pmax)*0.02||1, lo=pmin-pad, hi=pmax+pad;
  const L=54,R=12,T=14,B=26, W=cssW-L-R, H=cssH-T-B;
  const X=t=>L+(t-t0)/((t1-t0)||1)*W, Y=p=>T+(1-(p-lo)/((hi-lo)||1))*H;
  const chg=(ps[ps.length-1]-ps[0])/(ps[0]||1)*100;
  $('#chartSub').innerHTML=`现价 $${fmt(ps[ps.length-1])} · <span class="${chg>=0?'up':'down'}">${chg>=0?'+':''}${chg.toFixed(2)}%</span> · ${s.length}点 · ${fmtT(t0)}–${fmtT(t1)}`;
  // grid + y labels
  ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue('--line'); ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--dim');
  ctx.font='11px sans-serif'; ctx.lineWidth=1;
  for(let i=0;i<=4;i++){ const p=lo+(hi-lo)*i/4, y=Y(p); ctx.globalAlpha=.5; ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(cssW-R,y);ctx.stroke(); ctx.globalAlpha=1; ctx.textAlign='right';ctx.fillText('$'+fmt(p),L-6,y+3); }
  // x labels (start / mid / end)
  ctx.textAlign='center'; [t0,(t0+t1)/2,t1].forEach(t=>ctx.fillText(fmtT(t),X(t),cssH-8));
  // line
  const up=ps[ps.length-1]>=ps[0];
  ctx.strokeStyle=up?getComputedStyle(document.body).getPropertyValue('--up'):getComputedStyle(document.body).getPropertyValue('--down');
  ctx.lineWidth=2; ctx.beginPath(); s.forEach((x,i)=>{ const px=X(x[0]),py=Y(x[1]); i?ctx.lineTo(px,py):ctx.moveTo(px,py); }); ctx.stroke();
  // area
  ctx.globalAlpha=.08; ctx.lineTo(X(t1),T+H); ctx.lineTo(X(t0),T+H); ctx.closePath(); ctx.fillStyle=ctx.strokeStyle; ctx.fill(); ctx.globalAlpha=1;
  // last dot
  ctx.fillStyle=ctx.strokeStyle; ctx.beginPath(); ctx.arc(X(t1),Y(ps[ps.length-1]),3.5,0,7); ctx.fill();
}
async function load(){
  try{
    const r=await fetch('api/data?window='+win, {cache:'no-store'});
    data=await r.json();
    const n=data.samples.length;
    $('#status').textContent = n? `${Object.keys(data.names).length}个商品 · ${n}个采样 · 更新 ${new Date().toLocaleTimeString('zh-CN')}` : '暂无采样数据（采集器刚启动，稍候）';
    renderTable(); drawChart();
  }catch(e){ $('#status').textContent='加载失败：'+e.message; }
}
window.addEventListener('resize', drawChart);
load(); setInterval(load, 30000);   // auto-refresh every 30s
</script>
</body>
</html>
